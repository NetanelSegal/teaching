<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>שיעור 6 מעבדה - ניווט וניתוב</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f3f4f6;
        color: #1f2937;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }
      #root {
        width: 100%;
        max-width: 600px;
      }
      .box {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 20px;
        margin: 16px 0;
        background-color: #ffffff;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      }
      header nav {
        background-color: #1f2937;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        display: flex;
        gap: 16px;
      }
      header nav a {
        color: #9ca3af;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
      }
      header nav a:hover {
        color: white;
      }
      button {
        background-color: #4b5563;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        margin-top: 12px;
      }
      button:hover {
        background-color: #374151;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
