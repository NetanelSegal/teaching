<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>שיעור 5 מעבדה - Context API</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        transition: background-color 0.3s, color 0.3s;
      }
      #root {
        width: 100%;
        max-width: 600px;
      }
      .box {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 20px;
        margin: 16px 0;
        background-color: #ffffff;
        color: #1f2937;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      }
      .dark-theme body {
        background-color: #1f2937;
        color: #f9fafb;
      }
      .dark-theme .box {
        background-color: #374151;
        color: #f9fafb;
        border-color: #4b5563;
      }
      button {
        background-color: #3b82f6;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
