<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>שיעור 8 מעבדה - עתיד ה-React</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f3f4f6;
        color: #1f2937;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }
      #root {
        width: 100%;
        max-width: 600px;
      }
      .box {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 20px;
        margin: 16px 0;
        background-color: #ffffff;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      }
      input {
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        width: 250px;
      }
      button {
        background-color: #10b981;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        margin-top: 8px;
      }
      button:hover {
        background-color: #059669;
      }
      button:disabled {
        background-color: #a7f3d0;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
