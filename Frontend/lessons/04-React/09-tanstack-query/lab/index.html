<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>שיעור 9 מעבדה - TanStack Query</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f3f4f6;
        color: #1f2937;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }
      #root {
        width: 100%;
        max-width: 600px;
      }
      .box {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 20px;
        margin: 16px 0;
        background-color: #ffffff;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      }
      .todo-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e5e7eb;
        padding: 10px 0;
      }
      .todo-item:last-child {
        border-bottom: none;
      }
      button {
        background-color: #3b82f6;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background-color: #2563eb;
      }
      button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }
      .delete-btn {
        background-color: #ef4444;
      }
      .delete-btn:hover {
        background-color: #dc2626;
      }
      input {
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        width: 250px;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
