<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modal Exercise</title>
    <style>
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 1px solid black; }
        .modal.active { display: block; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .overlay.active { display: block; }
    </style>
</head>
<body>
    <button id="open-btn">Open Modal</button>
    <div id="overlay" class="overlay"></div>
    <div id="modal" class="modal">
        <h2>Modal Title</h2>
        <p>This is a modal!</p>
        <button id="close-btn">Close</button>
    </div>
    <script type="module" src="./exercises.js"></script>
</body>
</html>
