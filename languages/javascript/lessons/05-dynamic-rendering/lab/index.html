<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5: Dynamic Rendering</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 5px solid #6200ea; }
        .card h3 { margin: 0 0 10px; }
        .card p { color: #666; font-size: 0.9em; }
        .controls { margin-bottom: 20px; padding: 15px; background: #eee; border-radius: 8px; }
        button { padding: 10px 15px; cursor: pointer; background: #6200ea; color: white; border: none; border-radius: 4px; }
        button:hover { background: #3700b3; }
        ul#shopping-list { background: white; padding: 20px; border-radius: 8px; list-style: none; }
        ul#shopping-list li { padding: 8px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dynamic Dashboard 🚀</h1>

        <!-- Mission 1: Shopping List -->
        <section>
            <h2>Mission 1: Shopping List (createElement)</h2>
            <ul id="shopping-list">
                <!-- Data should appear here -->
            </ul>
        </section>

        <hr>

        <!-- Mission 2 & 3: Product Grid -->
        <section>
            <h2>Mission 2 & 3: Product Catalog (innerHTML)</h2>
            <div class="controls">
                <button id="show-all-btn">Show All</button>
                <button id="filter-cheap-btn">Under $50</button>
            </div>
            <div id="product-grid" class="grid">
                <!-- Product cards should appear here -->
            </div>
        </section>
    </div>

    <script type="module" src="exercises.js"></script>
</body>
</html>
